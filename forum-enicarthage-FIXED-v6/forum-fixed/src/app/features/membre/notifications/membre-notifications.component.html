<!-- src/app/features/membre/notifications/membre-notifications.component.html -->
<app-layout title="Mes Notifications" subtitle="Historique de toutes vos notifications">

  <div class="notif-header-bar">
    <div class="notif-count">
      <span *ngIf="unreadCount > 0">{{ unreadCount }} non lue(s)</span>
      <span *ngIf="unreadCount === 0">Toutes lues ✅</span>
    </div>
    <button class="btn btn-outline btn-sm" (click)="marquerToutLu()" *ngIf="unreadCount > 0">
      ✓ Tout marquer comme lu
    </button>
  </div>

  <div class="loading-state" *ngIf="loading">Chargement...</div>

  <div class="notif-list" *ngIf="!loading">
    <div class="notif-card" *ngFor="let n of notifications"
         [class.unread]="!n.lu"
         [ngClass]="typeBg(n.type)"
         (click)="marquerLu(n)">
      <div class="nc-icon">{{ typeIcon(n.type) }}</div>
      <div class="nc-body">
        <div class="nc-msg">{{ n.message }}</div>
        <div class="nc-date">{{ n.dateEnvoi | date:'dd/MM/yyyy à HH:mm' }}</div>
      </div>
      <div class="nc-badge" *ngIf="!n.lu">
        <span class="unread-dot"></span>
      </div>
      <div class="nc-read" *ngIf="n.lu">✓</div>
    </div>
    <div class="empty-state" *ngIf="notifications.length === 0">Aucune notification.</div>
  </div>

</app-layout>
